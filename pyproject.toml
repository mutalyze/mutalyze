[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mutalyze"
version = "0.1.0"
description = "Catches your coding agent breaking your own CLAUDE.md rules, and tells you which rule and at which turn."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "mutalyze", email = "307315485+mutalyze@users.noreply.github.com" }]
keywords = ["claude", "agent", "claude-code", "rules", "compliance", "audit"]
dependencies = ["PyYAML>=5.4"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mutalyze/mutalyze"
Repository = "https://github.com/mutalyze/mutalyze"
Issues = "https://github.com/mutalyze/mutalyze/issues"

[project.scripts]
mutalyze = "mutalyze.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mutalyze*"]
